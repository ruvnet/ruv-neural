# cargo-deny configuration (ADR-0015 / Helix ADR-051 supply-chain gate).
#
# `cargo deny check` is a required release gate for the NeuroSleep crates: they
# sign and emit derived neural research evidence that a downstream repository
# verifies, so a permissive-only, crates.io-only dependency graph is a release
# condition. Anything not listed below fails the gate rather than warning.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # bincode 1.3.3 is unmaintained (RUSTSEC-2025-0141). It is reachable only
    # through ruv-neural-memory -> ruv-neural-cli, which is not part of the
    # NeuroSleep signing, DSP, or contract path and never parses untrusted
    # bundles. Revisit when ruv-neural-memory moves to bincode 2.x.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x confined to the CLI memory store; outside the NeuroSleep trust path" },
]

[licenses]
version = 2
# Permissive licenses only; copyleft (GPL/AGPL/LGPL/MPL) is absent by
# construction and an unlisted license is a hard failure.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
