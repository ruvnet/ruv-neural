name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustfmt --edition 2021 --check ruv-neural-core/src/neurosleep.rs ruv-neural-core/src/attestation.rs
      - run: cargo clippy -p ruv-neural-core --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ruv-neural-wasm --target wasm32-unknown-unknown --release --locked
