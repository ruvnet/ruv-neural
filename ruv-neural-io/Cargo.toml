[package]
name = "ruv-neural-io"
description = "Bounded native EEG recording adapters for rUv Neural"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["neural", "eeg", "edf", "streaming", "parser"]
